# Headers for API responses (JSON and generated PDFs). The PDF letters are previewed inside the app,
# so framing is allowed for the same origin only, and the browser's PDF viewer may run (object-src).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Content-Security-Policy "default-src 'none'; object-src 'self'; frame-ancestors 'self'" always;
