# Local development dependencies. The API, worker and web app run on the host for fast reloads.
name: pramaan-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pramaan
      POSTGRES_PASSWORD: pramaan
      POSTGRES_DB: pramaan
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramaan -d pramaan"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
