[project]
name = "pramaan-api"
version = "0.1.0"
description = "Pramaan API: security deposit and FDR management for the AICTE Regulation Bureau"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.162,<0.163",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.11,<3",
    "sqlalchemy[asyncio]>=2.1.6,<2.2",
    "asyncpg>=0.31",
    "alembic>=1.20.1,<1.21",
    "arq>=0.28,<0.29",
    "argon2-cffi>=25.1",
    "itsdangerous>=2.2",
    "cryptography>=50.0.2",
    "orjson>=3.11",
    "python-multipart>=0.0.20",
    "boto3>=1.43",
    "reportlab>=5.1",
    "email-validator>=2.3",
    "onnxruntime>=1.23",
    "rapidocr-onnxruntime>=1.2.3",
    "opencv-python-headless>=4.12",
    "numpy>=2.3",
    "lightgbm>=4.6",
    "pypdfium2>=4.30",
    "pillow>=11.3",
    "tzdata>=2025.2",
    "uharfbuzz>=0.50",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.2",
    "httpx>=0.28.1",
    "hypothesis>=6.140",
    "ruff>=0.14",
    "mypy>=1.18",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PT018"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.domain.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["slow: runs OCR models (seconds per test)"]
